# Local development stack: only the infrastructure the backend needs.
# Usage:
#   docker compose -f docker-compose.dev.yaml up -d
#   cd backend-python && python -m app.main
#
# Volume names carry a _dev suffix on purpose. Compose derives the project name
# from this directory, so a plain `db_data` here would resolve to exactly the
# same volume as the production docker-compose.yaml in the same directory.
services:
  smart-home-db:
    image: postgres:17-alpine
    container_name: smart-home-db-dev
    environment:
      - POSTGRES_USER=smarthome
      - POSTGRES_PASSWORD=smarthome
      - POSTGRES_DB=smarthome
    ports:
      # 5433 on the host to avoid clashing with other local postgres instances
      - "5433:5432"
    volumes:
      - db_data_dev:/var/lib/postgresql/data

  influxdb:
    image: influxdb:2-alpine
    container_name: influxdb-dev
    environment:
      # Only applied on an empty volume; an existing one keeps its credentials.
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=dev
      - DOCKER_INFLUXDB_INIT_PASSWORD=dev-password
      - DOCKER_INFLUXDB_INIT_ORG=smart-home
      - DOCKER_INFLUXDB_INIT_BUCKET=telemetry
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=dev-token
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data_dev:/var/lib/influxdb2

  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: mqtt-broker-dev
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"

volumes:
  db_data_dev:
  influxdb_data_dev:
