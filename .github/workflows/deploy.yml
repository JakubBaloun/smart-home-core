name: Deploy to Pi 5
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    env:
      NETWORK: smart-home-py-ci
      DB: smart-home-py-ci-db
    steps:
      - name: Clean workspace
        run: sudo rm -rf mosquitto zigbee2mqtt

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image
        working-directory: backend-python
        run: |
          docker build --target test -t smart-home-py:test .
          docker build -t smart-home-py:latest .

      - name: Start test database
        run: |
          docker rm -f "$DB" || true
          docker network create "$NETWORK" || true
          docker run -d --name "$DB" --network "$NETWORK" \
            -e POSTGRES_USER=smarthome \
            -e POSTGRES_PASSWORD=smarthome \
            -e POSTGRES_DB=smarthome_py_test \
            postgres:17
          for _ in $(seq 1 30); do
            docker exec "$DB" pg_isready -U smarthome && exit 0
            sleep 2
          done
          echo "postgres did not become ready" && exit 1

      - name: Backend tests
        run: |
          docker run --rm --network "$NETWORK" \
            -v "$GITHUB_WORKSPACE/backend-python:/app" \
            -e TEST_DB_URL="postgresql+psycopg://smarthome:smarthome@$DB:5432/smarthome_py_test" \
            smart-home-py:test python -m pytest -q

      - name: Stop test database
        if: always()
        run: |
          docker rm -f "$DB" || true
          docker network rm "$NETWORK" || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci
          npm test

      - name: Docker build and deploy
        run: |
          docker build -t smart-home-frontend:latest ./frontend
          docker compose --env-file /home/jakub/.env up -d
