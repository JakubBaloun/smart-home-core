name: Deploy to Pi 5
on:
  push:
    branches: [ main ]
    # Documentation-only pushes must not redeploy production. Everything listed
    # here was checked against what actually reaches a running container:
    #   * backend-python/Dockerfile COPYs only pyproject.toml, app/ and
    #     schema.sql — its README.md never enters the image.
    #   * frontend/Dockerfile does `COPY . .`, but nothing imports markdown and
    #     the final nginx stage takes only dist/ + nginx.conf, so a .md edit
    #     cannot change the runtime image.
    # Deliberately NOT ignored: backend/** (it owns the Flyway migrations that
    # docker-compose.yaml mounts), infra/**, bruno/**, and every workflow file.
    # workflow_dispatch is unaffected by this filter, so a manual redeploy is
    # always available.
    paths-ignore:
      - 'README.md'
      - 'CLAUDE.md'
      - '.claude/**'
      - 'backend-python/README.md'
      - 'frontend/README.md'
      - 'frontend/DESIGN.md'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    env:
      NETWORK: smart-home-py-ci
      DB: smart-home-py-ci-db
    steps:
      # Both must run before checkout: checkout deletes the workspace, and it
      # runs as the runner user, which cannot remove root-owned files.
      # The Python caches are root-owned because the test container writes them
      # into the mounted checkout; the test step now suppresses them, so this is
      # only here to recover workspaces polluted before that fix.
      - name: Clean workspace
        run: |
          sudo rm -rf mosquitto zigbee2mqtt
          sudo find . -name __pycache__ -o -name .pytest_cache | xargs -r sudo rm -rf

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend image
        working-directory: backend-python
        run: |
          docker build --target test -t smart-home-py:test .
          docker build -t smart-home-py:latest .

      - name: Start test database
        run: |
          docker rm -f "$DB" || true
          docker network create "$NETWORK" || true
          docker run -d --name "$DB" --network "$NETWORK" \
            -e POSTGRES_USER=smarthome \
            -e POSTGRES_PASSWORD=smarthome \
            -e POSTGRES_DB=smarthome_py_test \
            postgres:17
          for _ in $(seq 1 30); do
            docker exec "$DB" pg_isready -U smarthome && exit 0
            sleep 2
          done
          echo "postgres did not become ready" && exit 1

      - name: Backend tests
        run: |
          docker run --rm --network "$NETWORK" \
            -v "$GITHUB_WORKSPACE/backend-python:/app" \
            -e TEST_DB_URL="postgresql+psycopg://smarthome:smarthome@$DB:5432/smarthome_py_test" \
            -e PYTHONDONTWRITEBYTECODE=1 \
            smart-home-py:test python -m pytest -q -p no:cacheprovider

      - name: Stop test database
        if: always()
        run: |
          docker rm -f "$DB" || true
          docker network rm "$NETWORK" || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci
          npm test

      - name: Docker build and deploy
        run: |
          docker build -t smart-home-frontend:latest ./frontend
          docker compose --env-file /home/jakub/.env up -d
