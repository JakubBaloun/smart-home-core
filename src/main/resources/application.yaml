# --- SPOLEČNÁ KONFIGURACE ---
quarkus:
  http:
    port: 8080
  log:
    level: INFO
    console:
      format: "%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n"

  # Databáze (Postgres)
  datasource:
    db-kind: postgresql

  # Flyway migrace
  flyway:
    migrate-at-start: ${QUARKUS_FLYWAY_MIGRATE_AT_START:true}
    locations: db/migration
    baseline-on-migrate: true

# InfluxDB konfigurace
influxdb:
  url: ${INFLUXDB_URL:http://localhost:8086}
  token: ${INFLUXDB_TOKEN:my-super-secret-token}
  org: ${INFLUXDB_ORG:smart-home}
  bucket: ${INFLUXDB_BUCKET:telemetry}

# Reactive Messaging (MQTT)
mp:
  messaging:
    connector:
      smallrye-mqtt:
        host: ${MQTT_HOST:mqtt-broker}
        port: ${MQTT_PORT:1883}
        client-id: smart-home-core
        auto-generated-client-id: false
    incoming:
      zigbee2mqtt-bridge:
        connector: smallrye-mqtt
        topic: zigbee2mqtt/bridge/state

# Test profile - override MQTT to use Dev Services broker
"%test":
  mp:
    messaging:
      connector:
        smallrye-mqtt:
          # Use the Testcontainers broker provided by Dev Services
          # This is automatically configured and works in tests
          host: ${quarkus.reactive-messaging-mqtt.devservices.host:localhost}
          port: ${quarkus.reactive-messaging-mqtt.devservices.port:1883}
