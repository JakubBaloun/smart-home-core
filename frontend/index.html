<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus</title>
    <script>
      const KNOWN = ['light', 'graphite', 'obsidian-aurora', 'amber-forge', 'midnight-chrome']
      let stored = localStorage.getItem('nexus-theme')
      if (stored === 'dark') stored = 'graphite'
      const chosen = KNOWN.includes(stored)
        ? stored
        : matchMedia('(prefers-color-scheme: light)').matches
          ? 'light'
          : 'graphite'
      document.documentElement.dataset.theme = chosen
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
